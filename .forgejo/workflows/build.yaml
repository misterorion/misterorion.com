name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  astro:
    name: Build and Deploy
    runs-on: docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Astro
        uses: https://forgejo.pegasus.mechapower.com/mechapower/shared-actions/astro@main

      - name: Deploy to S3
        uses: https://forgejo.pegasus.mechapower.com/mechapower/shared-actions/s3@main
        with:
          domain: misterorion.com

      - name: Notify Google Chat
        if: always()
        uses: https://forgejo.pegasus.mechapower.com/mechapower/shared-actions/notify-chat@main
        with:
          webhook_url: ${{ secrets.CHAT_WEBHOOK_URL }}
          status: ${{ job.status }}