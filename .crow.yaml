when:
  - event: push
    branch: main
  - event: pull_request
    branch: main
  - event: manual

steps:
  - name: build
    image: public.ecr.aws/docker/library/node:24-slim
    commands:
      - npm ci
      - npm run build

  - name: deploy
    image: forgejo.pegasus.mechapower.com/mechapower/s3-deploy:1
    settings:
      domain: misterorion.com
      s3_static_base:
        from_secret: s3_static_base

  - name: notify-success
    image: forgejo.pegasus.mechapower.com/mechapower/chat-notify:1
    settings:
      status: success
      webhook_url:
        from_secret: chat_webhook_url
    when:
      - status: [success]

  - name: notify-failure
    image: forgejo.pegasus.mechapower.com/mechapower/chat-notify:1
    settings:
      status: failure
      webhook_url:
        from_secret: chat_webhook_url
    when:
      - status: [failure]
